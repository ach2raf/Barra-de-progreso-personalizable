<div class="container mt-4">
 
  <app-custom-progress-bar
    [value]="value()"
    [color]="color()"
    [striped]="striped()"
    [animated]="animated()"
    [showLabel]="showLabel()"
    [height]="height()"
  />

  <div class="card card-body mt-4">
    <div class="mb-3">
      <label class="form-label">Valor: {{ value() }}%</label>
      <input type="range" class="form-range" min="0" max="100"
             [value]="value()" (input)="setValue($event)" />
    </div>

    <div class="mb-3">
      <label class="form-label">Color</label>
      <select class="form-select" (change)="setColor($event)">
        @for (c of colores; track c) {
          <option [value]="c" [selected]="c === color()">{{ c }}</option>
        }
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Altura: {{ height() }}px</label>
      <input type="range" class="form-range" min="10" max="60"
             [value]="height()" (input)="setHeight($event)" />
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="striped"
             [checked]="striped()" (change)="setStriped($event)" />
      <label class="form-check-label" for="striped">Rayada (striped)</label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="animated"
             [checked]="animated()" [disabled]="!striped()" (change)="setAnimated($event)" />
      <label class="form-check-label" for="animated">Animada</label>
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="label"
             [checked]="showLabel()" (change)="setShowLabel($event)" />
      <label class="form-check-label" for="label">Mostrar porcentaje</label>
    </div>

    <button class="btn btn-outline-secondary" (click)="reiniciar()">Reiniciar</button>
  </div>
</div>
